services:
  accessibility-test:
    build:
      context: .
      dockerfile: Containerfile.test

      args:
        NODE_IMAGE: docker.io/library/node:24-bookworm-slim
        PLAYWRIGHT_VERSION: "1.62.0"

    image: localhost/basil-portfolio-accessibility-test:1.0.0

    init: true
    ipc: host

    environment:
      CI: "true"

    security_opt:
      - no-new-privileges:true
