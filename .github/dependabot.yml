version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      quality-tooling:
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript*"
          - "@playwright/*"
          - "@axe-core/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
